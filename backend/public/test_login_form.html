<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Login Test</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-top: 0; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; color: #666; }
        input[type="email"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #0056c9; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #00449e; }
        #result { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; font-size: 0.9rem; word-wrap: break-word; }
        .success { background: #e6ffed; border: 1px solid #b7ebc5; color: #1a7f37; }
        .error { background: #ffebe9; border: 1px solid #ff8182; color: #cf222e; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Test Backend Connection</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" value="superadmin@civilpro.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="CivilPro@12345" required>
            </div>
            <button type="submit" id="submitBtn">Log In</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = 'Testing...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('https://white-marten-572750.hostingersite.com/backend/public/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, remember: false })
                });

                const data = await response.json();
                
                resultDiv.style.display = 'block';
                if (response.ok && data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `<strong>Success!</strong><br><br>The backend connected to the DB perfectly.<br><br>Welcome: ${data.data.user.first_name} ${data.data.user.last_name}`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>Failed:</strong> ${data.message || 'Unknown error'}`;
                }
            } catch (err) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>Network Error:</strong> Cannot reach backend server.`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
